# Ustachi — to'liq stack: MongoDB + Backend (Node/Express) + Web (Vite → Nginx SPA)
# Ishga tushirish:  docker compose up -d --build
# Kerakli sozlamalar: react-tutorial/backend/.env dan avtomatik olinadi (MONGO_URI o'rniga container ichki DB ishlatiladi)

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./react-tutorial/backend
    restart: unless-stopped
    env_file: ./react-tutorial/backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/ustachi
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    ports:
      - "5000:5000"

  web:
    build: ./react-tutorial
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
  uploads: